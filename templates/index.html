<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Foster MBA Course Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <div class="app-shell">

      <header class="topbar">
        <div class="brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
          <div>
            <h1>Foster MBA <span>Course Assistant</span></h1>
            <p class="topbar-sub">UW Foster School of Business</p>
          </div>
        </div>
        <span id="status" class="status-pill">Checking…</span>
      </header>

      <main class="chat-panel">
        <div id="messages" class="messages">

          <div class="welcome" id="welcome">
            <div class="welcome-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
              </svg>
            </div>
            <h2>Find your <span>perfect course</span></h2>
            <p class="welcome-sub">
              Describe your career goal or interests and I'll recommend the best Foster MBA electives — plus tell you when they're typically offered.
            </p>
            <div class="chips">
              <button class="chip">Which courses fit a corporate finance goal?</button>
              <button class="chip">What does MGMT 547 cover?</button>
              <button class="chip">I'm interested in startups — what should I take?</button>
              <button class="chip">Which courses cover sustainability or ESG?</button>
            </div>
          </div>

        </div>

        <div class="composer-area">
          <form id="chat-form" class="composer">
            <textarea id="message-input" rows="1" placeholder="Ask about Foster MBA courses…" required></textarea>
            <button type="submit" class="send-btn" aria-label="Send">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
          </form>
          <p class="disclaimer">Answers are based on Foster MBA syllabi and past schedules only.</p>
        </div>
      </main>

    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
